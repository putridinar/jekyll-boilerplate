<style>
.card {
  box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
  max-width: 300px;
  margin: auto;
  text-align: center;
  font-family: arial;
}
.img-cover {
    background-img: url({{site.baseurl}}/assets/images/img.png);
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center center;
 }

.title {
  color: grey;
  font-size: 18px;
}

button {
  border: none;
  box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
  outline: 0;
  display: inline-block;
  padding: 8px;
  color: white;
  background-color: #000;
  text-align: center;
  cursor: pointer;
  width: 100%;
  font-size: 18px;
}

a {
  text-decoration: none;
  font-size: 22px;
  color: black;
}

button:hover, a:hover {
  opacity: 0.7;
}
</style>


     <script type="module">
       const firebaseConfig = {
       apiKey: "{{ site.API_KEY }}",
       authDomain: "{{ site.AUTH_DOMAIN }}",
       databaseURL: "{{ site.DATABASE_URL }}",
       projectId: "{{ site.PROJECT_ID }}",
       storageBucket: "{{ site.STORAGE_BUCKET }}",
       messagingSenderId: "{{ site.SENDER_ID }}",
       appId: "{{ site.APP_ID }}",
       measurementId: "{{ site.MEASUREMENT_ID }}"
       };firebase.initializeApp(firebaseConfig);const auth=firebase.auth();const userSignedOutDiv=document.getElementById('user-out');const userSignedInDiv=document.getElementById('user-in');const userDisplayName=document.getElementById('user-name');const userEmail=document.getElementById('user-email');const signOutButton=document.getElementById('logout-button');function toggleUI(){if(auth.currentUser){userDisplayName.textContent=auth.currentUser.displayName;userEmail.textContent=auth.currentUser.email}else{location.href="{{site.baseurl}}/"}
if(firebase.auth().currentUser.photoURL){document.querySelector('#userImg').src=firebase.auth().currentUser.photoURL}}
signOutButton.addEventListener('click',()=>{auth.signOut()});auth.onAuthStateChanged(user=>{toggleUI()})
     </script>

<h2 style="text-align:center">Selamat Datang</h2>

</div>
