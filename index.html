layout: default
permalink: /home
---

{% include profil.html %}

<div class="container-post">
<div class="post_contain">
<div id="posts"></div>
</div>
</div>

    <script>
async function fetchPosts() {
    try {
        const response = await fetch('/posts.json');
        
        // Periksa apakah respons berhasil
        if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const data = await response.json();
        
        // Pastikan data.posts ada dan berupa array
        if (!data.posts || !Array.isArray(data.posts)) {
            throw new Error("Invalid data format");
        }

        const postsContainer = document.getElementById("posts");
        if (!postsContainer) {
            throw new Error('Element with ID "posts" not found.');
        }

        postsContainer.innerHTML = data.posts.map(post => `
  <div class="grid_contain">
<a href="${post.url}">
   <img class="img_contain" src="${post.img}" />
<div class="grid_body">
                        <span class="grid_title">${post.title}</span>
                        <p>${post.rtp}</p></a>
</div>
  </div>
        `).join("");
    } catch (error) {
        console.error("Error fetching posts:", error);
        alert(`Error fetching posts: ${error.message}`);
    }
}

fetchPosts();
    </script>
