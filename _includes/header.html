<style type="text/css">
/* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

/* Header */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #333;
    color: white;
    padding: 15px 20px;
    position: fixed;
    top: 0;
    left: 0;
}

/* Logo */
.logo {
    font-size: 1.5em;
    font-weight: bold;
}

/* Navigasi Desktop */
.nav-links {
    display: flex;
    gap: 15px;
}

.nav-links a {
    color: white;
    text-decoration: none;
    font-size: 1em;
    transition: 0.3s;
}

.nav-links a:hover {
    color: #ff9800;
}

/* Tombol Hamburger */
.hamburger {
    display: none;
    background: none;
    border: none;
    color: white;
    font-size: 1.8em;
    cursor: pointer;
}

/* Menu Mobile */
.mobile-menu {
    display: none;
    flex-direction: column;
    background: #444;
    position: absolute;
    top: 60px;
    left: 0;
    width: 100%;
    padding: 10px 0;
}

.mobile-menu a {
    color: white;
    padding: 10px 20px;
    text-decoration: none;
    display: block;
}

.mobile-menu a:hover {
    background: #555;
}

/* Tampilkan menu saat aktif */
.mobile-menu.show {
    display: flex;
}

/* Responsive untuk Mobile */
@media (max-width: 768px) {
    .nav-links {
        display: none; /* Sembunyikan menu desktop */
    }
    
    .hamburger {
        display: block; /* Tampilkan tombol hamburger */
    }
}
</style>
<header>
    <div class="logo">{{site.title}}</div>
    <nav class="nav-links">
    <a href="{{site.baseurl}}/home">Beranda</a>
    <a href="{{site.baseurl}}/">Produk</a>
    <a href="{{site.baseurl}}/profil">Profil</a>
    </nav>
    <button class="hamburger">&#9776;</button>
</header>

<!-- Menu Mobile -->
<div class="mobile-menu">
    <a href="{{site.baseurl}}/home">Beranda</a>
    <a href="{{site.baseurl}}/">Produk</a>
    <a href="{{site.baseurl}}/profil">Profil</a>
</div>

<script>
    // Toggle menu saat tombol hamburger ditekan
    document.querySelector(".hamburger").addEventListener("click", function() {
        document.querySelector(".mobile-menu").classList.toggle("show");
    });
</script>
