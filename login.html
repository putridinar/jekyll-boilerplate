    <div class="signin_box">
      <div id="user-signed-out" class="box_login">
        <img class="googl_icon" alt="Google" src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/Google_%22G%22_Logo.svg/768px-Google_%22G%22_Logo.svg.png" />
        <div class="card-header">
          <div class="card-title">Masuk Menggunakan Google</div>
          <div class="subtitle">Untuk melanjutkan silahkan login dengan akun google anda.</div>
        </div>
                  <button class="btn-login" id="log-in-button" fill="clear">Sign in</button>
      </div>
    </div>


  <script type="module">
    const firebaseConfig = {
    apiKey: "{{ site.API_KEY }}",
    authDomain: "{{ site.AUTH_DOMAIN }}",
    databaseURL: "{{ site.DATABASE_URL }}",
    projectId: "{{ site.PROJECT_ID }}",
    storageBucket: "{{ site.STORAGE_BUCKET }}",
    messagingSenderId: "{{ site.SENDER_ID }}",
    appId: "{{ site.APP_ID }}",
    measurementId: "{{ site.MEASUREMENT_ID }}"
    };firebase.initializeApp(firebaseConfig);const auth=firebase.auth();const userSignedInDiv=document.getElementById('user-signed-in');const signInButton=document.getElementById('log-in-button');function toggleUI(){if(auth.currentUser){location.href="{{site.baseurl}}/home"}else{}}
        signInButton.addEventListener('click',()=>{const provider=new firebase.auth.GoogleAuthProvider();auth.signInWithPopup(provider)});auth.onAuthStateChanged(user=>{toggleUI()})
  </script>
